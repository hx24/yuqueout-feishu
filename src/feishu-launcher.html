<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>语雀迁移到飞书</title>
<style>
*{box-sizing:border-box}
body{margin:0;width:390px;min-height:360px;padding:20px;background:linear-gradient(145deg,#f4f7ff,#fff);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#192e4c}
.head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.logo{background:#3370ff;color:white;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;font-weight:800}
h1{font-size:19px;margin:0}p{margin:5px 0 14px;color:#62718b}
.tag{font-size:11px;color:#385dac;background:#e8efff;border-radius:99px;padding:3px 9px}
.steps{display:grid;grid-template-columns:1fr 24px 1fr;align-items:center;gap:6px;text-align:center;margin:20px 0;color:#405576;font-size:12px}
.step{background:white;border:1px solid #e1e8f7;border-radius:10px;padding:12px 5px}
button{display:block;width:100%;cursor:pointer;border-radius:10px;padding:13px;font-size:14px;font-weight:650;margin:11px 0;border:1px solid transparent}
button.primary{background:#3370ff;color:white}
button.secondary{background:white;color:#304e82;border-color:#d8e3f9}
button:hover{filter:brightness(.97)}
.note{font-size:12px;color:#62718b;line-height:1.6;margin-top:14px}
#status{font-size:12px;margin:10px 0 0;min-height:16px;color:#385dac}
</style></head>
<body>
<div class="head"><div class="logo">语→飞</div><div><h1>语雀 → 飞书文档</h1><span class="tag">一次性迁移 · v1.3.1 测试版</span></div></div>
<p>将语雀的 Markdown 文档和图片转换为飞书在线文档，无需先导出到本地。</p>
<div class="steps"><div class="step">① 选择语雀知识库</div><span>→</span><div class="step">② 迁移到飞书</div></div>
<button class="secondary" id="chooseYuque" type="button">① 选择知识库 / 获取文档列表</button>
<button class="primary" id="openFeishuMigration" type="button">② 打开飞书迁移面板 →</button>
<div id="status" aria-live="polite"></div>
<div class="note">提示：原 YuqueOut 的「开始导出」只会保存到本地，请使用上方“打开飞书迁移面板”完成迁移。</div>
<script src="feishu-launcher.js"></script>
</body></html>
